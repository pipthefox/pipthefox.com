<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-System Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #c8c8c8;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    overflow: hidden;
    height: 100vh;
  }
  #container {
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 320px;
    min-width: 320px;
    background: #111;
    border-right: 1px solid #222;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #canvas-wrap {
    flex: 1;
    position: relative;
    background: #0a0a0a;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  h1 {
    font-size: 16px;
    color: #e8e8e8;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 11px;
    color: #666;
    margin-top: 4px;
  }
  label {
    display: block;
    font-size: 11px;
    color: #888;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ddd;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: #4a7;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > div { flex: 1; }
  .rules-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .rule-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .rule-row input:first-child {
    width: 40px;
    min-width: 40px;
    flex: 0;
    text-align: center;
  }
  .rule-row input:last-of-type {
    flex: 1;
  }
  .rule-row button {
    background: #2a1a1a;
    border: 1px solid #442;
    color: #a66;
    cursor: pointer;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
  }
  .rule-row button:hover {
    background: #3a2020;
    color: #c88;
  }
  button.primary {
    background: #1a2a1a;
    border: 1px solid #2a4a2a;
    color: #6a6;
    cursor: pointer;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
    transition: all 0.2s;
  }
  button.primary:hover {
    background: #1e331e;
    color: #8c8;
  }
  button.secondary {
    background: #1a1a2a;
    border: 1px solid #2a2a4a;
    color: #66a;
    cursor: pointer;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
  }
  button.secondary:hover {
    background: #1e1e33;
    color: #88c;
  }
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .presets button {
    background: #181818;
    border: 1px solid #2a2a2a;
    color: #999;
    cursor: pointer;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .presets button:hover {
    background: #222;
    color: #ccc;
    border-color: #444;
  }
  .presets button.active {
    background: #1a2a1a;
    border-color: #3a5a3a;
    color: #8c8;
  }
  .info {
    font-size: 11px;
    color: #555;
    line-height: 1.5;
    border-top: 1px solid #1a1a1a;
    padding-top: 12px;
  }
  .info code {
    color: #7a7;
    background: #151515;
    padding: 1px 4px;
    border-radius: 2px;
  }
  .stats {
    font-size: 11px;
    color: #555;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stats span { color: #777; }
  #generation-slider {
    width: 100%;
    appearance: none;
    height: 4px;
    background: #222;
    border-radius: 2px;
    outline: none;
  }
  #generation-slider::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    background: #4a7;
    border-radius: 50%;
    cursor: pointer;
  }
  .color-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 3px;
    border: 1px solid #333;
    cursor: pointer;
    position: relative;
  }
  .color-swatch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  .gen-display {
    font-size: 13px;
    color: #6a6;
    text-align: center;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div id="container">
  <div id="sidebar">
    <div>
      <h1>L-System Explorer</h1>
      <div class="subtitle">Fractal grammars → branching structures</div>
    </div>

    <div>
      <label>Presets</label>
      <div class="presets" id="presets"></div>
    </div>

    <div>
      <label>Axiom</label>
      <input type="text" id="axiom" value="X" spellcheck="false">
    </div>

    <div>
      <label>Production Rules</label>
      <div class="rules-container" id="rules"></div>
      <button class="secondary" onclick="addRule()" style="margin-top:6px">+ Add Rule</button>
    </div>

    <div class="row">
      <div>
        <label>Angle (°)</label>
        <input type="number" id="angle" value="25" step="1">
      </div>
      <div>
        <label>Step Length</label>
        <input type="number" id="step" value="4" step="0.5" min="0.5">
      </div>
    </div>

    <div>
      <div class="gen-display">Generation: <span id="gen-label">4</span></div>
      <input type="range" id="generation-slider" min="0" max="8" value="4">
    </div>

    <div>
      <label>Line Color</label>
      <div class="color-row">
        <div class="color-swatch" id="color-swatch" style="background:#4a7">
          <input type="color" id="line-color" value="#44aa77">
        </div>
        <input type="number" id="line-alpha" value="60" min="5" max="100" step="5" style="width:60px">
        <span style="font-size:11px;color:#666">% opacity</span>
      </div>
    </div>

    <div>
      <button class="primary" onclick="render()" style="width:100%">Draw</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="info">
      <code>F</code> draw forward &nbsp;
      <code>f</code> move forward<br>
      <code>+</code> turn left &nbsp;
      <code>-</code> turn right<br>
      <code>[</code> push state &nbsp;
      <code>]</code> pop state<br>
      <code>|</code> turn 180° &nbsp;
      Other symbols: rewrite only
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
const presets = [
  {
    name: 'Fractal Plant',
    axiom: 'X',
    rules: { 'X': 'F+[[X]-X]-F[-FX]+X', 'F': 'FF' },
    angle: 25,
    step: 4,
    generations: 5
  },
  {
    name: 'Fern',
    axiom: 'Y',
    rules: { 'X': 'X[-FFF][+FFF]FX', 'Y': 'YFX[+Y][-Y]' },
    angle: 25.7,
    step: 6,
    generations: 5
  },
  {
    name: 'Bush',
    axiom: 'F',
    rules: { 'F': 'FF+[+F-F-F]-[-F+F+F]' },
    angle: 22.5,
    step: 4,
    generations: 4
  },
  {
    name: 'Sticks',
    axiom: 'X',
    rules: { 'X': 'F[+X]F[-X]+X', 'F': 'FF' },
    angle: 20,
    step: 3,
    generations: 6
  },
  {
    name: 'Weed',
    axiom: 'F',
    rules: { 'F': 'F[+F]F[-F]F' },
    angle: 25.7,
    step: 3,
    generations: 4
  },
  {
    name: 'Koch Curve',
    axiom: 'F',
    rules: { 'F': 'F+F-F-F+F' },
    angle: 90,
    step: 3,
    generations: 4
  },
  {
    name: 'Sierpinski',
    axiom: 'F-G-G',
    rules: { 'F': 'F-G+F+G-F', 'G': 'GG' },
    angle: 120,
    step: 5,
    generations: 6
  },
  {
    name: 'Dragon Curve',
    axiom: 'FX',
    rules: { 'X': 'X+YF+', 'Y': '-FX-Y' },
    angle: 90,
    step: 5,
    generations: 10
  },
  {
    name: 'Hilbert',
    axiom: 'A',
    rules: { 'A': '-BF+AFA+FB-', 'B': '+AF-BFB-FA+' },
    angle: 90,
    step: 6,
    generations: 5
  },
  {
    name: 'Penrose',
    axiom: '[7]++[7]++[7]++[7]++[7]',
    rules: { '6': '8F++9F----7F[-8F----6F]++', '7': '+8F--9F[---6F--7F]+', '8': '-6F++7F[+++8F++9F]-', '9': '--8F++++6F[+9F++++7F]--7F', 'F': '' },
    angle: 36,
    step: 12,
    generations: 4
  },
  {
    name: 'Lévy C',
    axiom: 'F',
    rules: { 'F': '+F--F+' },
    angle: 45,
    step: 4,
    generations: 10
  },
  {
    name: 'Crystal',
    axiom: 'F+F+F+F',
    rules: { 'F': 'FF+F++F+F' },
    angle: 90,
    step: 3,
    generations: 4
  }
];

let currentPreset = 0;

function populatePresets() {
  const container = document.getElementById('presets');
  presets.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.onclick = () => loadPreset(i);
    container.appendChild(btn);
  });
}

function loadPreset(idx) {
  currentPreset = idx;
  const p = presets[idx];
  document.getElementById('axiom').value = p.axiom;
  document.getElementById('angle').value = p.angle;
  document.getElementById('step').value = p.step;
  document.getElementById('generation-slider').value = p.generations;
  document.getElementById('gen-label').textContent = p.generations;

  // Update active preset button
  document.querySelectorAll('.presets button').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });

  // Rebuild rules
  const rulesContainer = document.getElementById('rules');
  rulesContainer.innerHTML = '';
  for (const [sym, prod] of Object.entries(p.rules)) {
    addRule(sym, prod);
  }

  render();
}

function addRule(sym = '', prod = '') {
  const container = document.getElementById('rules');
  const row = document.createElement('div');
  row.className = 'rule-row';
  row.innerHTML = `
    <input type="text" value="${sym}" maxlength="1" spellcheck="false" placeholder="X">
    <span style="color:#444">→</span>
    <input type="text" value="${prod}" spellcheck="false" placeholder="production">
    <button onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(row);
}

function getRules() {
  const rules = {};
  document.querySelectorAll('.rule-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    const sym = inputs[0].value.trim();
    const prod = inputs[1].value.trim();
    if (sym && prod) rules[sym] = prod;
  });
  return rules;
}

function generate(axiom, rules, n) {
  let current = axiom;
  for (let i = 0; i < n; i++) {
    let next = '';
    for (const ch of current) {
      next += rules[ch] !== undefined ? rules[ch] : ch;
    }
    current = next;
    // Safety: if string gets too long, stop
    if (current.length > 2_000_000) {
      return current;
    }
  }
  return current;
}

function computeBounds(str, angleDeg, step) {
  let x = 0, y = 0;
  let dir = -90; // start pointing up
  const rad = angleDeg * Math.PI / 180;
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  const stack = [];

  for (const ch of str) {
    switch (ch) {
      case 'F': case 'G':
        x += Math.cos(dir * Math.PI / 180) * step;
        y += Math.sin(dir * Math.PI / 180) * step;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        break;
      case 'f':
        x += Math.cos(dir * Math.PI / 180) * step;
        y += Math.sin(dir * Math.PI / 180) * step;
        break;
      case '+': dir -= angleDeg; break;
      case '-': dir += angleDeg; break;
      case '|': dir += 180; break;
      case '[': stack.push({ x, y, dir }); break;
      case ']':
        if (stack.length) {
          const s = stack.pop();
          x = s.x; y = s.y; dir = s.dir;
        }
        break;
    }
  }
  return { minX, maxX, minY, maxY };
}

function render() {
  const canvas = document.getElementById('canvas');
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const w = wrap.clientWidth;
  const h = wrap.clientHeight;

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, w, h);

  const axiom = document.getElementById('axiom').value;
  const rules = getRules();
  const angleDeg = parseFloat(document.getElementById('angle').value) || 25;
  const baseStep = parseFloat(document.getElementById('step').value) || 4;
  const gen = parseInt(document.getElementById('generation-slider').value) || 0;

  const str = generate(axiom, rules, gen);

  // Compute bounds to auto-fit
  const bounds = computeBounds(str, angleDeg, baseStep);
  const bw = bounds.maxX - bounds.minX || 1;
  const bh = bounds.maxY - bounds.minY || 1;
  const margin = 40;
  const scaleX = (w - margin * 2) / bw;
  const scaleY = (h - margin * 2) / bh;
  const scale = Math.min(scaleX, scaleY, 20); // cap scale so small things don't blow up
  const step = baseStep * scale;

  // Center offset
  const cx = w / 2 - ((bounds.minX + bounds.maxX) / 2) * scale;
  const cy = h / 2 - ((bounds.minY + bounds.maxY) / 2) * scale;

  // Get color
  const colorHex = document.getElementById('line-color').value;
  const alpha = parseInt(document.getElementById('line-alpha').value) / 100;
  const r = parseInt(colorHex.slice(1, 3), 16);
  const g = parseInt(colorHex.slice(3, 5), 16);
  const b = parseInt(colorHex.slice(5, 7), 16);

  ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
  ctx.lineWidth = Math.max(0.5, Math.min(2, 1 / (gen * 0.3 + 1) * 1.5));
  ctx.lineCap = 'round';

  let x = cx;
  let y = cy;
  let dir = -90;
  const stack = [];
  let segments = 0;

  ctx.beginPath();
  ctx.moveTo(x, y);

  for (const ch of str) {
    switch (ch) {
      case 'F': case 'G': {
        const nx = x + Math.cos(dir * Math.PI / 180) * step;
        const ny = y + Math.sin(dir * Math.PI / 180) * step;
        ctx.lineTo(nx, ny);
        x = nx; y = ny;
        segments++;
        break;
      }
      case 'f': {
        const nx = x + Math.cos(dir * Math.PI / 180) * step;
        const ny = y + Math.sin(dir * Math.PI / 180) * step;
        ctx.moveTo(nx, ny);
        x = nx; y = ny;
        break;
      }
      case '+': dir -= angleDeg; break;
      case '-': dir += angleDeg; break;
      case '|': dir += 180; break;
      case '[':
        stack.push({ x, y, dir });
        break;
      case ']':
        if (stack.length) {
          ctx.stroke();
          ctx.beginPath();
          const s = stack.pop();
          x = s.x; y = s.y; dir = s.dir;
          ctx.moveTo(x, y);
        }
        break;
    }
  }
  ctx.stroke();

  // Stats
  document.getElementById('stats').innerHTML =
    `<span>String: ${str.length.toLocaleString()} chars</span>` +
    `<span>Segments: ${segments.toLocaleString()}</span>` +
    `<span>Rules: ${Object.keys(rules).length}</span>`;
}

// Slider
document.getElementById('generation-slider').addEventListener('input', (e) => {
  document.getElementById('gen-label').textContent = e.target.value;
  render();
});

// Color swatch update
document.getElementById('line-color').addEventListener('input', (e) => {
  document.getElementById('color-swatch').style.background = e.target.value;
  render();
});
document.getElementById('line-alpha').addEventListener('change', render);

// Auto-render on input changes
['axiom', 'angle', 'step'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});

// Resize
window.addEventListener('resize', render);

// Init
populatePresets();
loadPreset(0);
</script>
</body>
</html>
